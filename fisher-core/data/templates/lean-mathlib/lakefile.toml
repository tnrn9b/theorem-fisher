name = "{{project}}"
version = "0.1.0"
defaultTargets = ["{{project}}"]

[leanOptions]
pp.unicode.fun = true
autoImplicit = false
relaxedAutoImplicit = false

{{#if smt}}
# lean-smt before Mathlib: with Mathlib last, its versions of the packages
# both depend on take precedence
[[require]]
name = "smt"
scope = "ufmg-smite"
rev = "{{smt}}"

{{/if}}
[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "{{mathlib}}"

[[lean_lib]]
name = "{{project}}"
