fisher:
  compatibility:
    legacy_skill_surface: false
    legacy_cli_surface: false
  autoformalize:
    backend: claude-code
    handoff_mode: auto
    auth_mode: auto
    managed_state_dir: ''
  project:
    template_source: ''
model: anthropic/claude-opus-4.6
toolsets:
- fisher-cli
agent:
  max_turns: 90
terminal:
  backend: local
  cwd: .
  timeout: 180
  docker_image: nikolaik/python-nodejs:python3.11-nodejs20
  singularity_image: docker://nikolaik/python-nodejs:python3.11-nodejs20
  modal_image: nikolaik/python-nodejs:python3.11-nodejs20
  daytona_image: nikolaik/python-nodejs:python3.11-nodejs20
  container_cpu: 1
  container_memory: 5120
  container_disk: 51200
  container_persistent: true
  docker_volumes: []
  docker_mount_cwd_to_workspace: false
  persistent_shell: true
browser:
  inactivity_timeout: 120
  record_sessions: false
cli:
  handoff:
    mode: auto
    launchers: {}
checkpoints:
  enabled: true
  max_snapshots: 50
compression:
  enabled: true
  threshold: 0.5
  summary_model: google/gemini-3-flash-preview
  summary_provider: auto
auxiliary:
  vision:
    provider: auto
    model: ''
    base_url: ''
    api_key: ''
  web_extract:
    provider: auto
    model: ''
    base_url: ''
    api_key: ''
  compression:
    provider: auto
    model: ''
    base_url: ''
    api_key: ''
  session_search:
    provider: auto
    model: ''
    base_url: ''
    api_key: ''
  skills_hub:
    provider: auto
    model: ''
    base_url: ''
    api_key: ''
  approval:
    provider: auto
    model: ''
    base_url: ''
    api_key: ''
  mcp:
    provider: auto
    model: ''
    base_url: ''
    api_key: ''
  flush_memories:
    provider: auto
    model: ''
    base_url: ''
    api_key: ''
display:
  compact: false
  personality: kawaii
  resume_display: full
  bell_on_complete: false
  show_reasoning: false
  show_cost: false
  skin: default
privacy:
  redact_pii: false
tts:
  provider: edge
  edge:
    voice: en-US-AriaNeural
  elevenlabs:
    voice_id: pNInz6obpgDQGcFmaJgB
    model_id: eleven_multilingual_v2
  openai:
    model: gpt-4o-mini-tts
    voice: alloy
stt:
  enabled: true
  provider: local
  local:
    model: base
  openai:
    model: whisper-1
voice:
  record_key: ctrl+b
  max_recording_seconds: 120
  auto_tts: false
  silence_threshold: 200
  silence_duration: 3.0
human_delay:
  mode: 'off'
  min_ms: 800
  max_ms: 2500
memory:
  memory_enabled: true
  user_profile_enabled: true
  memory_char_limit: 2200
  user_char_limit: 1375
delegation:
  model: ''
  provider: ''
  base_url: ''
  api_key: ''
prefill_messages_file: ''
timezone: ''
discord:
  require_mention: true
  free_response_channels: ''
  auto_thread: true
approvals:
  mode: manual
command_allowlist: []
quick_commands: {}
personalities: {}
security:
  redact_secrets: true
  tirith_enabled: true
  tirith_path: tirith
  tirith_timeout: 5
  tirith_fail_open: true
_config_version: 9
