name:        fisher-core
version:     0.2.0.0
synopsis:    Config, project model and paths shared by every Fisher package
license:     BSD-3-Clause
author:      Tom Reynolds

extra-source-files:
- data/*
- data/templates/**/*
- data/lessons/*

language: GHC2021

default-extensions:
- OverloadedStrings
- LambdaCase

ghc-options:
- -Wall
- -Wcompat

dependencies:
- base >= 4.14 && < 5
- aeson
- attoparsec
- bytestring
- containers
- scientific
- directory
- file-embed
- filepath
- temporary
- text
- time
- typed-process
- process
- unicode-transforms
- unix
- vector
- yaml
- sqlite-simple
- conduit
- resourcet
- libyaml

library:
  source-dirs: src

tests:
  fisher-core-test:
    main:        Spec.hs
    source-dirs: test
    build-tools: hspec-discover
    # ClaudeAuthSpec times out a child: the timer needs the threaded RTS,
    # as the fisher executable has; RunlogSpec needs two capabilities so its
    # two writers really contend for the database
    ghc-options: -threaded -with-rtsopts=-N2
    dependencies:
    - fisher-core
    - hspec
    - temporary
    - QuickCheck
    - vector
    - aeson
    - scientific
    - async
