name:        fisher-tools
version:     0.2.0.0
synopsis:    The agent's tool registry, toolsets, file tools and sandboxes (local, docker, ssh)
license:     BSD-3-Clause
author:      Tom Reynolds

language: GHC2021

default-extensions:
- OverloadedStrings
- LambdaCase

ghc-options:
- -Wall
- -Wcompat

dependencies:
- base >= 4.14 && < 5
- fisher-core
- async
- bytestring
- containers
- directory
- filepath
- process
- random
- stm
- text
- time
- unix

library:
  source-dirs: src

tests:
  fisher-tools-test:
    main:        Spec.hs
    source-dirs: test
    build-tools: hspec-discover
    ghc-options: -threaded
    dependencies:
    - fisher-tools
    - hspec
    - temporary
