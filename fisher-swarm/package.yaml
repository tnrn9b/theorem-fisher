name:        fisher-swarm
version:     0.2.0.0
synopsis:    Managed workflow sessions - PTY sessions, stream-json progress, attach, cancel
license:     BSD-3-Clause
author:      Tom Reynolds

language: GHC2021

default-extensions:
- OverloadedStrings
- LambdaCase

ghc-options:
- -Wall
- -Wcompat

dependencies:
- base >= 4.14 && < 5
- fisher-core
- fisher-workflow
- aeson
- aeson-pretty
- async
- bytestring
- containers
- directory
- filepath
- process
- stm
- text
- time
- unix
- vector

library:
  source-dirs: src
  c-sources: cbits/fisher_pty.c

tests:
  fisher-swarm-test:
    main:        Spec.hs
    source-dirs: test
    build-tools: hspec-discover
    ghc-options: -threaded
    dependencies:
    - fisher-swarm
    - hspec
    - temporary
    - vector
