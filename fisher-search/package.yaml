name:        fisher-search
version:     0.2.0.0
synopsis:    The proof-search swarm (D) - open goals, parallel attempts across backends, shared kernel-checked lemmas, budgets
license:     BSD-3-Clause
author:      Tom Reynolds

language: GHC2021

default-extensions:
- OverloadedStrings
- LambdaCase

ghc-options:
- -Wall
- -Wcompat

dependencies:
- base >= 4.14 && < 5
- fisher-core
- fisher-llm
- aeson
- async
- bytestring
- containers
- directory
- filepath
- process
- scientific
- text
- time
- unix

library:
  source-dirs: src

tests:
  fisher-search-test:
    main:        Spec.hs
    source-dirs: test
    build-tools: hspec-discover
    ghc-options: -threaded
    dependencies:
    - fisher-search
    - hspec
    - QuickCheck
    - temporary
